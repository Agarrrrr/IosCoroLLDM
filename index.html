    <!-- Splash Screen Nativo -->
    <div id="splash-nativo" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #fdfdfd; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; transition: opacity 0.4s ease-out, visibility 0.4s ease-out;">
        <div id="splash-logo" style="width: 120px; height: 120px; background-color: #0d47a1; -webkit-mask-image: url(/assets/icono.svg); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; mask-image: url(/assets/icono.svg); mask-size: contain; mask-repeat: no-repeat; mask-position: center; animation: pulse 2s infinite ease-in-out;" aria-label="Logo"></div>
        <script>
            (function() {
                try {
                    var tema = localStorage.getItem('tema-ui');
                    var splash = document.getElementById('splash-nativo');
                    var logo = document.getElementById('splash-logo');
                    if (['oscuro', 'contraste', 'oled', 'quiet'].includes(tema)) {
                        splash.style.backgroundColor = '#11161c';
                        logo.style.backgroundColor = '#ffffff';
                    } else if (tema === 'sepia') {
                        splash.style.backgroundColor = '#f4ecd8';
                        logo.style.backgroundColor = '#4e342e';
                    } else {
                        logo.style.backgroundColor = '#0d47a1';
                    }
                } catch(e) {}
            })();
        </script>
        <style>
            @keyframes pulse {
                0% { transform: scale(0.95); opacity: 0.8; }
                50% { transform: scale(1.05); opacity: 1; }
                100% { transform: scale(0.95); opacity: 0.8; }
            }
        </style>

                </div>

                <div class="midi-tool-item" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.05);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <label style="margin-bottom: 0;"><span data-i18n="midi.velocidad">VELOCIDAD:</span> <span id="midi-speed-value" style="color: var(--color-acento);">1.00x</span></label>
                    </div>
                    <input type="range" id="midi-speed-control" min="0.5" max="1.5" step="0.05" value="1" class="midi-slider-progreso">
                    <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
                        <button id="midi-btn-speed-reset" data-i18n="midi.resetear" style="background: rgba(212, 175, 55, 0.15); color: var(--color-acento); border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;">RESTABLECER (1.0x)</button>
                    </div>
                </div>

                <div class="midi-tool-item" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.05);">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="margin-bottom: 0;" data-i18n="midi.metronomo">METRÓNOMO (CLICK)</label>
                        <input type="checkbox" id="midi-metronomo-toggle" style="width: 20px; height: 20px; accent-color: var(--color-acento);">
                    </div>
                </div>

                <div class="midi-mixer-container">
                    <p class="section-label" data-i18n="midi.mixer">MIXER DE VOCES</p>
                    <div id="midi-mixer-sliders" class="mixer-grid">
                        <!-- Se genera dinámicamente -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ajustes -->
    <div id="modal-ajustes" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="ajustes.titulo">Ajustes de la App</h3>
                <button id="btn-cerrar-ajustes" class="btn-cerrar-ico">✕</button>
            </div>

            <!-- IDIOMA -->
            <div class="ajustes-seccion">
                <p class="section-label" data-i18n="ajustes.idioma">IDIOMA / LANGUAGE</p>
                <div class="tarjeta-info preferencias-grid" style="padding: 10px 16px;">
                    <div class="preferencia-item nav-segmentada" style="gap: 8px;">
                        <div class="segmented-control">
                            <button id="btn-lang-es" class="segmented-btn activo">Español</button>
                            <button id="btn-lang-en" class="segmented-btn">English</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 2. NAVEGACIÓN -->
            <div class="ajustes-seccion">
                <p class="section-label" data-i18n="ajustes.navegacion">NAVEGACIÓN</p>
                <div class="tarjeta-info preferencias-grid" style="padding: 10px 16px;">
                    <div class="preferencia-item nav-segmentada" style="gap: 8px;">
                        <div class="segmented-control">
                            <button id="btn-nav-scroll" class="segmented-btn activo">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                                <span data-i18n="ajustes.scroll">Scroll</span>
                            </button>
                            <button id="btn-nav-paginas" class="segmented-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                                <span data-i18n="ajustes.paginas">Páginas</span>
                            </button>
                        </div>
                    </div>
                </div>



            <!-- 5. PREFERENCIAS -->
            <div class="ajustes-seccion" style="display: none; padding-top: 10px;">
                <label class="checkbox-premium">
                    <input type="checkbox" id="chk-habilitar-jukebox">
                    <div class="checkbox-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <span class="checkbox-label" data-i18n="ajustes.chk_reproductor_global">Mostrar reproductor global</span>
                </label>
            </div>

            <div class="ajustes-footer" style="padding-bottom: 70px;">
                <p class="app-version">CoroLLDM <span>v1.0.0</span></p>
                <p class="developer" data-i18n="ajustes.developer">Desarrollado por <strong>Huri Tolentino</strong></p>
            </div>
        </div>
    </div>


    <script type="module" src="/src/main.js"></script>
</body>
</html>
