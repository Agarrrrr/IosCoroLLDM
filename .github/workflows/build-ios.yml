name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to App Store Connect
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Register Local Plugins
        run: node scripts/registerLocalPlugins.js

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install Apple Certificate & Configure Keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD="Television2012"
          
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import certificate from base64
          echo "${{ secrets.APPLE_P12_BASE64 }}" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "${{ secrets.APPLE_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Add temporary keychain to user search list so xcodebuild finds the certificate
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

      - name: Debug - List signing identities
        run: |
          security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db

      - name: Create App Store Connect API Private Key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Build Xcode Archive
        run: |
          BUILD_NUMBER=$((25 + ${{ github.run_number }}))
          echo "Building with CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     -allowProvisioningUpdates \
                     -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
                     -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
                     CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
                     CODE_SIGN_IDENTITY="" \
                     archive

      - name: Export IPA
        id: export
        run: |
          for i in 1 2 3; do
            echo "--- Export attempt $i/3 ---"
            xcodebuild -exportArchive \
                       -archivePath $RUNNER_TEMP/App.xcarchive \
                       -exportOptionsPlist ios/App/App/ExportOptions.plist \
                       -exportPath $RUNNER_TEMP/build \
                       -allowProvisioningUpdates \
                       -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
                       -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
                       -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
                       -verbose && { echo "ipa-path=$RUNNER_TEMP/build/App.ipa" >> $GITHUB_OUTPUT; exit 0; }
            echo "Export failed, waiting 30s before retry..."
            sleep 30
          done
          echo "Export failed after 3 attempts."
          exit 1
      
      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.export.outputs.ipa-path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
