name: coro_lldm
description: Prueba aislada de Verovio con fuentes propias.
publish_to: none
version: 0.3.1+4
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  flutter_midi_pro: ^4.0.4
  audioplayers: ^6.0.0
  path_provider: ^2.1.4
  verovio_flutter: 0.3.3
  jovial_svg: 1.1.29
  google_fonts: ^6.2.1
  xml: ^6.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: ScoreText
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
  assets:
    - assets/Piano.sf2
    - assets/audio/metro/
    - assets/scores/
    - assets/fonts/
