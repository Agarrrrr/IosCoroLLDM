<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="view-transition" content="same-origin">
    <title>Panel de Control | RepertorioBC Offline</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fdfdfd">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/gestor.css">

    <!-- PDF.js v4.10.38 cargado como script estático para evitar race conditions del bundler -->
    <script src="/vendor/pdf.legacy.min.js" defer></script>
</head>
<body>
    <div class="layout-maestro">
        
        <header class="topbar">
            <div class="topbar-izq">
                <div class="brand-wrapper">
                    <h2 class="logo-app">REPERTORIO BC OFFLINE</h2>
                    <span class="badge-rol" style="background: var(--navy-deep); color: white;">MODO DEV</span>
                </div>
            </div>
            
            <div class="topbar-centro">
            </div>

            <div class="topbar-der">
                <button id="btn-exportar-catalogo" class="btn-principal" onclick="exportarCatalogoLocal()">EXPORTAR CATÁLOGO</button>
                <button id="btn-ir-publico" class="btn-secundario">VER VISOR</button>
            </div>
        </header>

        <div class="cuerpo-aplicacion">
            <main class="contenido-principal">
                <div id="estado-carga-global" class="mensaje-estado">Inicializando base de datos local...</div>
                
                    <section id="panel-partituras" class="panel-viva" hidden></section>
                </div>
            </main>
        </div>
    </div>

    <div id="modal-partitura" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="titulo-form">GESTIÓN DE PARTITURA</h3>
                <button id="btn-cerrar-modal" class="btn-cerrar-ico">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <form id="form-partitura" class="form-gestor">
                <div class="campo-grupo">
                    <label>Nombre del Canto</label>
                    <input type="text" id="partitura-nombre" class="input-estandar" required placeholder="Ej: Las Bodas Del Cordero">
                </div>
                
                <div class="campo-grupo">
                    <label>Archivo PDF (Partitura)</label>
                    <label for="partitura-archivo-file" class="label-archivo-personalizado">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <span id="texto-archivo-seleccionado">SELECCIONAR PDF</span>
                    </label>
                    <input type="file" id="partitura-archivo-file" accept=".pdf" class="input-archivo-oculto">
                </div>

                <div class="campo-grupo">
                    <label>Archivo MIDI (Voces)</label>
                    <label for="partitura-midi-file" class="label-archivo-personalizado label-midi">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                        <span id="texto-midi-seleccionado">SELECCIONAR MIDI NUEVO</span>
                    </label>
                    <input type="file" id="partitura-midi-file" accept=".mid,.midi" class="input-archivo-oculto">
                    
                    <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px;">
                        <input type="hidden" id="partitura-midi-existente-hidden" value="">
                        <button type="button" id="btn-abrir-buscador-midi" class="btn-secundario" style="font-size: 13px; padding: 10px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; vertical-align: middle;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            BUSCAR MIDI EXISTENTE
                        </button>
                        <div id="texto-midi-existente-seleccionado" class="subtitulo" style="display:none; color: var(--gold-fuerte);"></div>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label>Vincular a Partitura (Cambio de Idioma)</label>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <input type="hidden" id="partitura-vinculo-idioma" value="">
                        <button type="button" id="btn-abrir-buscador-vinculo" class="btn-secundario" style="font-size: 13px; padding: 10px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; vertical-align: middle;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            BUSCAR PARTITURA
                        </button>
                        <div id="texto-vinculo-seleccionado" class="subtitulo" style="display:none; color: var(--gold-fuerte);"></div>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label>Seleccionar Temas Existentes</label>
                    <select id="partitura-temas" class="input-estandar" multiple style="height: 100px; padding: 8px;"></select>
                </div>

                <div class="campo-grupo">
                    <label>Nuevos Temas (Separar por coma)</label>
                    <input type="text" id="partitura-temas-libres" class="input-estandar" placeholder="Ej: Adoración, Gratitud">
                </div>

                <div class="botones-modal-grid">
                    <button type="button" onclick="document.getElementById('modal-partitura').style.display='none'" class="btn-secundario">CANCELAR</button>
                    <button type="submit" id="btn-guardar" class="btn-principal">GUARDAR CAMBIOS</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal Vista Previa -->
    <div id="modal-vista-previa" class="modal-overlay" style="display: none;">
        <div class="modal-content vista-previa-content">
            <div class="modal-header">
                <h3>VISTA PREVIA</h3>
                <button id="btn-cerrar-vista-previa" class="btn-cerrar-ico">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="contenedor-preview-pdf" class="contenedor-preview"></div>
        </div>
    </div>    

    <!-- Modal Buscador MIDI -->
    <div id="modal-buscador-midi" class="modal-overlay" style="display: none; z-index: 4000;">
        <div class="modal-content" style="max-height: 80vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h3>SELECCIONAR MIDI</h3>
                <button type="button" id="btn-cerrar-buscador-midi" class="btn-cerrar-ico">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <input type="text" id="input-buscar-midi" class="input-estandar" placeholder="Escribe el nombre del archivo..." style="margin-bottom: 15px;">
            <div id="lista-midis-resultados" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            </div>
        </div>
    </div>

    <!-- Modal Buscador Vinculo -->
    <div id="modal-buscador-vinculo" class="modal-overlay" style="display: none; z-index: 4000;">
        <div class="modal-content" style="max-height: 80vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h3>SELECCIONAR PARTITURA</h3>
                <button type="button" id="btn-cerrar-buscador-vinculo" class="btn-cerrar-ico">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <input type="text" id="input-buscar-vinculo" class="input-estandar" placeholder="Escribe el nombre de la partitura..." style="margin-bottom: 15px;">
            <div id="lista-vinculos-resultados" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            </div>
        </div>
    </div>

    <script type="module" src="/src/gestor/gestorApp.js"></script>
    <script>
        // Script simple para exportar el catalogo
        async function exportarCatalogoLocal() {
            try {
                const { localDB } = await import('/src/api/localDB.js');
                const cantos = await localDB.getCantos();
                // Limpiar data innecesaria que pudiera haber quedado en el json final (como el cantos_coros fake)
                const limpio = cantos.map(c => {
                    const obj = {...c};
                    delete obj.cantos_coros;
                    return obj;
                });
                const blob = new Blob([JSON.stringify(limpio, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'catalogo.json';
                a.click();
                URL.revokeObjectURL(url);
                if(window.mostrarToast) window.mostrarToast('Catálogo exportado exitosamente', 'exito');
            } catch(e) {
                console.error(e);
                alert('Error al exportar catálogo');
            }
        }
    </script>
</body>
</html>
